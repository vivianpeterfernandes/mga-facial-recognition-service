name: Face Rec Cloud Container Build

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Mutate Repository Owner to Lowercase
        id: string
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Monolithic Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.string.outputs.owner }}/mga-face-recognition-service:latest
          # FIX: Change cache scopes to force-evict the corrupted old URL manifests
          cache-from: type=gha,scope=face-rec-v2
          cache-to: type=gha,scope=face-rec-v2,mode=max