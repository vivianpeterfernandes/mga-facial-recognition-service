# =========================================================================
# Core Microservice Configurations
# =========================================================================
spring.application.name=mga-facial-recognition-service
server.port=8088

# Environment profile hooks used by Docker and Maven builds
app.environment=${SPRING_PROFILES_ACTIVE:@activatedEnv@}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:@activatedEnv@}

# Excludes unneeded databases to reduce memory usage during container boots
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# =========================================================================
# High-Performance Database Pools (Aiven Cloud PostgreSQL)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Tight pool numbers optimized for Zeabur's 2GB RAM container tier
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000

# =========================================================================
# Infrastructure Monitoring & Health Check Hooks
# =========================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# =========================================================================
# File Upload System Configuration
# =========================================================================
# Raised file allocations to accommodate larger 1080p profile video uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =========================================================================
# AI Model Infrastructure Workspace Configurations
# =========================================================================
ai.djl.repository.zoo.location=file:///app/models

# =========================================================================
# Decoupled Backblaze B2 S3 Asset Storage Layout
# =========================================================================
aws.s3.endpoint=${AWS_S3_ENDPOINT:https://backblazeb2.com}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:YOUR_BACKBLAZE_APPLICATION_KEY_ID}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:YOUR_BACKBLAZE_APPLICATION_KEY}
aws.s3.bucket=${AWS_S3_BUCKET:gym-faces}
